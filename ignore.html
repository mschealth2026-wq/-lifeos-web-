  const title = document.getElementById('mGTitle').value.trim(); if(!title) return;
  const pid = document.getElementById('mGProject').value;
  addEntity('goals', { title, description:document.getElementById('mGDesc').value.trim(), projectIds: pid?[pid]:[] }, 'user');
  closeModal(); toast('Goal created'); render();
}
function openDecisionModal(){
  openModal(`<div class="modal"><div class="modal-head"><div class="modal-title">Log a decision</div><button class="close-x" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="modal-body">
      <div><span class="field-label">Decision</span><input class="field-input" id="mDTitle" placeholder="Don't invest in Aariti Industries"></div>
      <div><span class="field-label">Reasoning</span><textarea class="field-input" id="mDReason"></textarea></div>
      <div><span class="field-label">Related project (optional)</span><select class="field-input" id="mDProject">${projectOptionsHtml()}</select></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-brass btn-sm" onclick="submitDecisionModal()">Log decision</button></div>
  </div>`);
}
function submitDecisionModal(){
  const title = document.getElementById('mDTitle').value.trim(); if(!title) return;
  addEntity('decisions', { title, notes:document.getElementById('mDReason').value.trim()||null, projectId:document.getElementById('mDProject').value||null }, 'user');
  closeModal(); toast('Decision logged'); render();
}
function openReminderModal(){
  const now = new Date(Date.now()+3600000);
  const dateVal = now.toISOString().slice(0,10); const timeVal = now.toTimeString().slice(0,5);
  openModal(`<div class="modal"><div class="modal-head"><div class="modal-title">New reminder</div><button class="close-x" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="modal-body">
      <div><span class="field-label">Remind me to…</span><input class="field-input" id="mRTitle" placeholder="Call the bank"></div>
      <div class="field-row">
        <div><span class="field-label">Date</span><input class="field-input" type="date" id="mRDate" value="${dateVal}"></div>
        <div><span class="field-label">Time</span><input class="field-input" type="time" id="mRTime" value="${timeVal}"></div>
      </div>
      <div><span class="field-label">Repeat</span><select class="field-input" id="mRRepeat"><option value="">Never</option><option value="daily">Daily</option><option value="weekly">Weekly</option></select></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-brass btn-sm" onclick="submitReminderModal()">Set reminder</button></div>
  </div>`);
}
function submitReminderModal(){
  const title = document.getElementById('mRTitle').value.trim(); if(!title) return;
  const date = document.getElementById('mRDate').value, time = document.getElementById('mRTime').value;
  addEntity('reminders', { title, remindAt:zonedToUtcISO(date, time, currentTz()), recurrence: document.getElementById('mRRepeat').value||null }, 'user');
  requestNotifPermission();
  closeModal(); toast('Reminder set'); render();
}
function openMemoryModal(){
  openModal(`<div class="modal"><div class="modal-head"><div class="modal-title">Remember something</div><button class="close-x" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="modal-body">
      <div><span class="field-label">What should I remember?</span><textarea class="field-input" id="mMContent" placeholder="Ravi prefers WhatsApp over email"></textarea></div>
      <div><span class="field-label">Category</span><select class="field-input" id="mMCategory">
        <option value="fact">Fact</option><option value="preference">Preference</option><option value="goal">Goal</option><option value="relationship">Relationship</option><option value="pattern">Pattern</option><option value="commitment">Commitment</option><option value="belief">Belief</option><option value="other" selected>Other</option>
      </select></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-brass btn-sm" onclick="submitMemoryModal()">Remember</button></div>
  </div>`);
}
function submitMemoryModal(){
  const content = document.getElementById('mMContent').value.trim(); if(!content) return;
  addEntity('memories', { content, category:document.getElementById('mMCategory').value, confidence:'stated', source:'user', lastUsed:nowISO(), lastConfirmed:nowISO() }, 'user');
  closeModal(); toast('Remembered'); render();
}

function openProjectModal(id){
  const p = projectById(id); if(!p) return;
  const ts = STATE.tasks.filter(t=>t.projectId===id); const open = ts.filter(t=>t.status!=='completed');
  const projIdeas = STATE.ideas.filter(i=>i.projectId===id); const projDecisions = STATE.decisions.filter(d=>d.projectId===id);
  const ms = projectMilestones(p); const progress = projectProgress(p); const health = HEALTH_META[projectHealthKey(p)]; const pulse = projectPulse(p);
  const recentActivity = STATE.activityLog.filter(a=>a.entityId===id || [].concat(ts,projIdeas,projDecisions,ms).some(e=>e.id===a.entityId)).slice(-10).reverse();
  openModal(`<div class="modal" style="max-width:660px;">
    <div class="modal-head"><div><div class="modal-title">${escapeHtml(p.name)}</div></div><button class="close-x" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--text-dim);line-height:1.5;">${escapeHtml(p.objective||'No objective set.')}</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <select class="field-input" style="width:auto;" onchange="updateEntity('projects','${p.id}',{status:this.value}); render();">
          ${['active','on hold','blocked','completed','abandoned','not started'].map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <span class="pill ${health.cls}" title="${escapeHtml(health.desc)}">${health.label}</span>
        ${progress!==null? `<span class="mono" style="font-size:12px;color:var(--text-faint);">${progress}% complete</span>`:''}
      </div>
      <div class="tiny" style="color:var(--text-faint);">Pulse: ${escapeHtml(pulse)}</div>
      <div id="projAssessment" class="margin-note"><button class="btn btn-ghost btn-sm" onclick="runProjectAssessment('${p.id}')">${ICONS.sparkle}<span>Get AI assessment</span></button></div>

      <div class="section-label" style="margin:6px 0 4px;">Milestones <span class="count">${ms.length}</span></div>
      <div class="stack">
        ${ms.map(m=>`<div class="task-row"><button class="checkbox ${m.status==='done'?'checked':''}" onclick="toggleMilestone('${m.id}')">${m.status==='done'?ICONS.check:''}</button>
          <div class="task-body"><div class="task-title ${m.status==='done'?'done':''}">${escapeHtml(m.title)}</div>${m.dueDate? `<div class="task-meta"><span>${fmtDate(m.dueDate)}</span></div>`:''}</div>
          <div class="task-actions" style="opacity:1;"><button class="btn-icon" onclick="removeMilestone('${m.id}')">${ICONS.x}</button></div></div>`).join('')}
        <div style="display:flex;gap:6px;">
          <input class="field-input" id="newMilestoneTitle" placeholder="Add a milestone…" style="flex:1;">
          <button class="btn btn-ghost btn-sm" onclick="addMilestoneFromModal('${p.id}')">${ICONS.plus}</button>
        </div>
      </div>

      <div class="section-label" style="margin:6px 0 4px;">Open tasks <span class="count">${open.length}</span></div>
      <div class="stack">${open.length? open.map(t=>taskRowHtml(t)).join('') : `<div style="font-size:12.5px;color:var(--text-faint);">None yet.</div>`}</div>
      ${projIdeas.length? `<div class="section-label" style="margin:6px 0 4px;">Ideas</div><div style="font-size:13px;color:var(--text-dim);">${projIdeas.map(i=>escapeHtml(i.title)).join(' · ')}</div>`:''}
      ${projDecisions.length? `<div class="section-label" style="margin:6px 0 4px;">Decisions</div><div style="font-size:13px;color:var(--text-dim);">${projDecisions.map(d=>escapeHtml(d.title)).join(' · ')}</div>`:''}
      ${recentActivity.length? `<div class="section-label" style="margin:6px 0 4px;">Activity</div><div>${recentActivity.map(a=>`<div class="activity-line"><span class="mono">${new Date(a.ts).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span><span>${a.entityType} ${a.action} ${a.source==='ai'?'· by assistant':''}</span></div>`).join('')}</div>`:''}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost btn-sm" style="color:var(--coral);" onclick="deleteProject('${p.id}')">Delete project</button><button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button></div>
  </div>`);
}
async function runProjectAssessment(id){
  const p = projectById(id); if(!p) return;
  const el = document.getElementById('projAssessment'); if(el) el.innerHTML = '<span class="loader"></span> assessing…';
  try{ const r = await aiProjectAssessment(p); if(el) el.innerHTML = escapeHtml(r.assessment||''); }
  catch(e){ if(el) el.innerHTML = 'Could not generate an assessment right now.'; }
}
function deleteProject(id){
  if(!confirm('Delete this project? Tasks, ideas and milestones linked to it will be unassigned, not deleted.')) return;
  deleteEntity('projects', id, 'user');
  [STATE.tasks, STATE.ideas, STATE.thoughts, STATE.notes, STATE.decisions, STATE.followups, STATE.milestones].forEach(arr=>arr.forEach(e=>{ if(e.projectId===id) e.projectId=null; }));
  scheduleSave(); closeModal(); render();
}
function addMilestoneFromModal(projectId){
  const input = document.getElementById('newMilestoneTitle'); const title = input.value.trim(); if(!title) return;
  addEntity('milestones', { title, projectId }, 'user');
  openProjectModal(projectId);
}
function toggleMilestone(id){ const m = STATE.milestones.find(x=>x.id===id); if(!m) return; updateEntity('milestones', id, {status: m.status==='done'?'open':'done'}); const modal=document.getElementById('modalOverlay'); if(modal && m.projectId) openProjectModal(m.projectId); render(); }
function removeMilestone(id){ const m = STATE.milestones.find(x=>x.id===id); deleteEntity('milestones', id); if(m && m.projectId) openProjectModal(m.projectId); render(); }

/* ---------------------------- Setup + Auth (gate everything else) ---------------------------- */
function renderSetupScreen(){
  document.getElementById('app').innerHTML = `
  <div style="max-width:480px;margin:60px auto;padding:24px;">
    <div class="serif" style="font-size:22px;margin-bottom:6px;">Set up LifeOS</div>
    <div class="tiny" style="margin-bottom:16px;">One-time setup for this browser — the same three values you used in the Android/Desktop app's local.properties.</div>
    <div style="margin-bottom:10px;"><span class="field-label">Supabase URL</span><input class="field-input" id="setupUrl" placeholder="https://your-project-ref.supabase.co"></div>
    <div style="margin-bottom:10px;"><span class="field-label">Supabase anon key</span><input class="field-input" id="setupKey" placeholder="eyJ..."></div>
    <div style="margin-bottom:16px;"><span class="field-label">Backend URL (Edge Function)</span><input class="field-input" id="setupBackend" placeholder="https://your-project-ref.supabase.co/functions/v1/claude-proxy"></div>
    <button class="btn btn-brass" onclick="submitSetup()">Continue</button>
  </div>`;
}
function submitSetup(){
  const url = document.getElementById('setupUrl').value.trim();
  const key = document.getElementById('setupKey').value.trim();
  const backend = document.getElementById('setupBackend').value.trim();
  if(!url || !key || !backend){ toast('Fill in all three fields'); return; }
  saveConfigLocal({ supabaseUrl:url, anonKey:key, backendUrl:backend });
  boot();
}
function renderAuthScreen(isSignUp){
  document.getElementById('app').innerHTML = `
  <div style="max-width:400px;margin:80px auto;padding:24px;">
    <div class="serif" style="font-size:22px;margin-bottom:16px;">${isSignUp?'Create your LifeOS account':'Sign in to LifeOS'}</div>
    <div style="margin-bottom:10px;"><input class="field-input" id="authEmail" placeholder="Email"></div>
    <div style="margin-bottom:16px;"><input class="field-input" type="password" id="authPassword" placeholder="Password"></div>
    <div id="authError" class="tiny" style="color:var(--coral);margin-bottom:10px;"></div>
    <button class="btn btn-brass" onclick="submitAuth(${isSignUp})">${isSignUp?'Sign up':'Sign in'}</button>
    <button class="btn btn-ghost" style="margin-left:8px;" onclick="renderAuthScreen(${!isSignUp})">${isSignUp?'Already have an account? Sign in':'New here? Create an account'}</button>
  </div>`;
}
async function submitAuth(isSignUp){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  try{
    if(isSignUp) await signUp(email, password); else await signIn(email, password);
    await startApp();
  }catch(e){ errEl.textContent = 'Could not sign in — check your email and password.'; }
}

/* ---------------------------- Boot ---------------------------- */
async function boot(){
  CONFIG = loadConfig();
  if(!CONFIG || !CONFIG.supabaseUrl || !CONFIG.anonKey || !CONFIG.backendUrl){
    renderSetupScreen();
    return;
  }
  document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--text-faint);gap:10px;"><span class="loader"></span> Checking your session…</div>`;
  const restored = await trySignInWithStoredSession();
  if(!restored){
    renderAuthScreen(false);
    return;
  }
  await startApp();
}
async function startApp(){
  document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--text-faint);gap:10px;"><span class="loader"></span> Loading LifeOS…</div>`;
  await loadState();
  render();
  checkReminders();
  REMINDER_TIMER = setInterval(checkReminders, 30000);
  generateDailyLine().then(line=>{
    const el = document.getElementById('briefingCard');
    if(el && line) el.innerHTML = `<span class="briefing-kicker">AI Briefing</span><span class="briefing-line serif">${escapeHtml(line)}</span>`;
  }).catch(()=>{});
}
boot();
</script>
